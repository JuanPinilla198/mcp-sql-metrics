[project]
name = "mcp-sql-metrics"
version = "0.1.0"
description = "An MCP server that exposes read-only SQL queries as typed tools, so the model decides and the database computes."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Juan Felipe Pinilla Lara" }]
keywords = ["mcp", "model-context-protocol", "llm", "postgresql", "sql", "agents"]

dependencies = [
    "mcp[cli]>=1.0.0",
    "psycopg[binary]>=3.1",
    "psycopg-pool>=3.2",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
mcp-sql-metrics = "mcp_sql_metrics.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_sql_metrics"]

[tool.ruff]
line-length = 88
target-version = "py310"
